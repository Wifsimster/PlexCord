<?xml version="1.0" encoding="UTF-8"?>
<!-- PlexCord README banner. Colors and type come from the SIGNAL design system
     (frontend/src/assets/tokens.css); the wordmark uses the same system font
     stack as the app, so it composes with the reader's own fonts. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="PlexCord — your Plex playback, live on Discord">
  <rect width="1200" height="320" fill="#0B0C0F"/>

  <g transform="translate(72 96) scale(0.875)">
    <rect x="3" y="27.5" width="15" height="9" rx="4.5" fill="#EDEDF0"/>
    <circle cx="32" cy="32" r="8.5" fill="#EDEDF0"/>
    <rect x="46" y="27.5" width="15" height="9" rx="4.5" fill="#EDEDF0"/>
  </g>
  <text x="150" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable','Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="600" letter-spacing="-0.8" fill="#EDEDF0">PlexCord</text>

  <text x="72" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable','Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#a5a6b1">Your Plex playback, live on Discord.</text>

  <g font-family="ui-monospace,'SF Mono','Cascadia Code','Segoe UI Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="14" fill="#8b8c98">
    <circle cx="77" cy="250" r="5" fill="#E5A00D"/>
    <text x="94" y="255">Plex</text>
    <rect x="140" y="249.5" width="880" height="1" fill="#26272f"/>
    <text x="1101" y="255" text-anchor="end">Discord</text>
    <circle cx="1123" cy="250" r="5" fill="#5865F2"/>
  </g>
</svg>
